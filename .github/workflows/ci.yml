name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Unit and package integration tests
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Type checking
        run: mypy src
      - name: Validate checked-in benchmark
        run: python benchmarking/validate_benchmark.py --lightweight test_data
      - name: Evaluate asm5 PAF baseline
        run: contigger benchmark --dataset test_data --paf test_data/alignments/all_vs_all.asm5.paf.gz
      - name: Evaluate asm20 PAF baseline
        run: contigger benchmark --dataset test_data --paf test_data/alignments/all_vs_all.asm20.paf.gz
      - name: Build exact sequence catalogue
        run: >-
          contigger catalogue --manifest test_data/manifest.tsv
          --output-fasta /tmp/contigger.catalogue.fasta
          --output-provenance /tmp/contigger.catalogue.provenance.tsv
      - name: Generate selective alignment candidates
        run: >-
          contigger candidates --manifest test_data/manifest.tsv
          --output /tmp/contigger.candidates.tsv
      - name: Evaluate asm5 catalogue-to-relationship baseline
        run: >-
          contigger benchmark-pipeline --dataset test_data
          --paf test_data/alignments/all_vs_all.asm5.paf.gz
          --output-json /tmp/contigger.pipeline.asm5.json
      - name: Evaluate asm20 catalogue-to-relationship baseline
        run: >-
          contigger benchmark-pipeline --dataset test_data
          --paf test_data/alignments/all_vs_all.asm20.paf.gz
          --output-json /tmp/contigger.pipeline.asm20.json
      - name: Validate unsimplified graph baseline
        run: pytest tests/test_graph.py tests/test_graph_benchmark.py
      - name: Validate conservative graph decision baseline
        run: pytest tests/test_decision_policy.py tests/test_decision_policy_benchmark.py
      - name: Validate provenance-complete path planning
        run: pytest tests/test_path_planning.py tests/test_path_planning_benchmark.py
      - name: Validate source-alignment evidence boundary
        run: pytest tests/test_bam_evidence.py
      - name: Validate targeted junction-remapping evidence boundary
        run: pytest tests/test_junction_evidence.py
      - name: Validate junction truth and support-policy boundary
        run: pytest tests/test_junction_benchmark.py
