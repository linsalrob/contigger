[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contigger"
version = "0.3.0"
description = "Conservative, provenance-aware reconciliation of assembled contigs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Contigger contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.4",
  "mypy>=1.8",
  "pytest>=8.0",
  "ruff>=0.5",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/linsalrob/contigger"
Documentation = "https://contigger.readthedocs.io/"
Repository = "https://github.com/linsalrob/contigger"
Issues = "https://github.com/linsalrob/contigger/issues"

[project.scripts]
contigger = "contigger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests", "benchmarking/tests"]
markers = ["integration: requires optional external bioinformatics tools"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
